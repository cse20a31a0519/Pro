/* CSS for card height, padding, and image centering/width */

.card-container {
    display: flex; /* or grid */
    flex-wrap: wrap; /* If using flexbox */
    gap: 20px; /* Space between cards */
    padding: 20px; /* Padding around the container */
    padding-top: 20px;
    padding-left: 20px;
    padding-right: 20px;
}

.card {
    height: 100%; /* Make all cards the same height */
    display: flex;
    flex-direction: column; /* Ensure content flows vertically */
}

.card .card-img-top { /* Target the image directly */
    width: 72%; /* Occupy 60% of the card width */
    height: auto; /* Maintain aspect ratio */
    object-fit: cover; /* or contain */
    padding: 30px ; /* Add padding around the image */
    margin: 0 auto; /* Center the image horizontally */
    display: block; /* Important for centering */
}

.card-body {
    flex-grow: 1; /* Allow card body to expand */
}

.card-price {
    font-weight: bold;
}

.btn-container {
    margin-top: auto; /* Push buttons to the bottom */
}

/* Any other styles you already have for your cards */


         .container {
        display: none; /* Hide the container initially */
    }
        #courses-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .course-card {
            flex: 1 1 calc(33.33% - 20px); /* 3 cards per row on larger screens */
            margin-bottom: 20px;
        }
        @media (max-width: 992px) {
            .course-card {
                flex: 1 1 calc(50% - 20px); /* 2 cards per row on medium screens */
            }
        }
        @media (max-width: 576px) {
            .course-card {
                flex: 1 1 100%; /* 1 card per row on small screens */
            }
        }
        .btn-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .card-img-top {
            max-height: 200px;
            object-fit: cover;
        }
    </style>
</head>
