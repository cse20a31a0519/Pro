<!DOCTYPE html>
<html>
<head>
    <title>Course Payment</title>
    <style>
        body {
            font-family: sans-serif;
        }
        #payment-details {
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 5px;
        }
        #payment-result { /* Style for the payment result message */
            margin-top: 20px;
            font-weight: bold;
        }
        .success {
            color: green;
        }
        .error {
            color: red;
        }

    </style>
</head>
<body>

    <h1>Course Payment</h1>

    <div id="payment-details">
        <p><strong>Course:</strong> <span id="course-title"></span></p>
        <p><strong>Price:</strong> <span id="course-price"></span></p>

        <label>
            <input type="radio" name="paymentMethod" value="card" checked> Credit/Debit Card
        </label><br>
        <label>
            <input type="radio" name="paymentMethod" value="upi"> UPI Payment
        </label><br>

        <button id="pay-now">Pay Now</button>
    </div>

    <div id="payment-result"></div>  </body>

</body>
</html>
