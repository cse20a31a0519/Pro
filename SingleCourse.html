<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
        }

        /* Header */
        header {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            text-align: center;
        }

        header nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        header nav a:hover {
            text-decoration: underline;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }

        /* Video List */
        .video-list {
            margin-bottom: 20px;
        }

        .video-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .video-item p {
            font-size: 16px;
        }

        /* Highlight Active Video */
        .video-item.active {
            background-color: #f1f1f1;
            border: 2px solid #007bff;
        }

        .video-item.active button {
            background-color: #007bff;
            color: white;
        }

        .video-item button {
            font-size: 14px;
            padding: 5px 10px;
            margin-left: 10px;
            cursor: pointer;
        }

        .video-item .btn-primary {
            background-color: #007bff;
            color: white;
            border: none;
        }

        .video-item .btn-primary:hover {
            background-color: #0056b3;
        }

        .video-item .btn-secondary {
            background-color: #6c757d;
            color: white;
            border: none;
        }

        .video-item .btn-secondary:hover {
            background-color: #5a6268;
        }

        .video-item .btn-success {
            background-color: #28a745;
            color: white;
            border: none;
        }

        .video-item .btn-success:hover {
            background-color: #218838;
        }

        /* Progress Bar */
        progress {
            width: 100%;
            height: 20px;
            margin-bottom: 20px;
        }

        #progress-text {
            font-size: 16px;
            margin-bottom: 20px;
        }

        /* Certificate Button */
        #generate-certificate {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            opacity: 0.6;
        }

        #generate-certificate:disabled {
            background-color: #ccc;
        }

        #generate-certificate:hover:not(:disabled) {
            background-color: #218838;
        }

        /* Video Display Div */
        .video-display {
            width: 100%;
            height: 500px;
            background-color: #000;
            margin-top: 20px;
            display: none; /* Initially hidden */
        }

        footer {
            background-color: #f1f1f1;
            padding: 10px 0;
            text-align: center;
            color: #333;
            font-size: 14px;
        }

    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Back to Courses</a>
        </nav>
    </header>

    <div id="course-detail-container" class="container">
        <h2>Course Details</h2>
        <div class="video-list">
            <!-- Video 1 -->
            <div class="video-item">
                <p>Video 1</p>
                <button class="btn-success">Complete</button>
                <button class="btn-secondary">Watch Later</button>
                <span class="video-url">Video URL: <a href="#">Watch Video</a></span>
            </div>
            <!-- Video 2 -->
            <div class="video-item">
                <p>Video 2</p>
                <button class="btn-success">Complete</button>
                <button class="btn-secondary">Watch Later</button>
                <span class="video-url">Video URL: <a href="#">Watch Video</a></span>
            </div>
            <!-- Video 3 -->
            <div class="video-item">
                <p>Video 3</p>
                <button class="btn-success">Complete</button>
                <button class="btn-secondary">Watch Later</button>
                <span class="video-url">Video URL: <a href="#">Watch Video</a></span>
            </div>
            <!-- Repeat similar structure for other videos (Video 4 to Video 10) -->
        </div>

        <!-- Video Display Div -->
        <div id="video-display" class="video-display">
            <!-- Video will be displayed here after URL is clicked -->
        </div>

        <!-- Progress Bar -->
        <progress value="0" max="100"></progress>
        <p id="progress-text">Progress: 0%</p>

        <!-- Generate Certificate Button -->
        <button id="generate-certificate" disabled>Generate Certificate</button>
    </div>

    <footer>
        <p>&copy; 2025 Course Platform</p>
    </footer>
</body>
</html>
