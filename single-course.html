<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Videos</title>
</head>
<body>
    <h1 id="courseTitle"></h1>
    <ul id="videoList"></ul>

    <!-- Include Firebase SDK (compatibility version) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <script>
        // Your web app's Firebase configuration
        const firebaseConfig = {
    apiKey: "AIzaSyB5iAUnK_5AP7ijrcQvlRfvCSfXrH9n6Ak",
    authDomain: "index-16f53.firebaseapp.com",
    projectId: "index-16f53",
    storageBucket: "index-16f53.firebasestorage.app",
    messagingSenderId: "171804052014",
    appId: "1:171804052014:web:c38d9d50835d551cafadbf"
};

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Get course title and category from local storage
        const courseTitle = localStorage.getItem('courseTitle');
        const courseCategory = localStorage.getItem('courseCategory');

        // Display course title in the UI
        document.getElementById('courseTitle').innerText = courseTitle;

        // Fetch video links and titles from Firebase
        const videoListRef = database.ref(`courses/${courseCategory}/${courseTitle}/Video_links`);
        videoListRef.on('value', (snapshot) => {
            const videos = snapshot.val();
            const videoList = document.getElementById('videoList');
            videoList.innerHTML = ''; // Clear previous list

            if (videos) {
                Object.keys(videos).forEach((key) => {
                    const video = videos[key];
                    console.log(`Title: ${video.title}, URL: ${video.url}`);

                    const listItem = document.createElement('li');
                    listItem.innerHTML = `<a href="${video.url}" target="_blank">${video.title}</a>`;
                    videoList.appendChild(listItem);
                });
            } else {
                console.log('No videos found for this course.');
                videoList.innerHTML = '<li>No videos found for this course.</li>';
            }
        });
    </script>
</body>
</html>
